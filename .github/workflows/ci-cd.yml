name: Java CI/CD

on:
  push:
    branches: [ "main", "master", "hw5threads" ]
  pull_request:
    branches: [ "main", "master", "hw5threads" ]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout кода
      uses: actions/checkout@v4

    - name: Установка Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Сборка проекта
      run: mvn clean compile -B

    - name: Запуск приложения
      run: mvn exec:java -Dexec.mainClass="org.example.Main" -B
